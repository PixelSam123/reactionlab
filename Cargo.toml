[package]
name = "reactionlab"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36"
egui_plot = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
dirs = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
