[package]
name = "reactionlab"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36"
egui_plot = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
dirs = "7.0"
ffmpeg-sidecar = "2.5"
rfd = "0.17"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
